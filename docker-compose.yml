services:
  app:
    build: .
    env_file: .env
    ports: ["8000:8000"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes: [app_storage:/var/www/html/storage/app]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
    command: sh -c "php artisan migrate --force && php artisan serve --host=0.0.0.0 --port=8000"
  worker:
    build: .
    env_file: .env
    volumes: [app_storage:/var/www/html/storage/app]
    depends_on: [app, redis]
    command: php artisan queue:work redis --queue=default,documents,agents --tries=3 --timeout=120
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: business_engine
      POSTGRES_USER: business_engine
      POSTGRES_PASSWORD: change-me
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U business_engine -d business_engine"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes: [redis_data:/data]
volumes:
  postgres_data:
  redis_data:
  app_storage: