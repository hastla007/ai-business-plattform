services:
  app:
    build: .
    env_file: .env
    ports: ["8000:8000"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes: [app_storage:/var/www/html/storage/app, ./.env:/var/www/html/.env]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
    command: sh -c "php artisan migrate --force && php artisan serve --host=0.0.0.0 --port=8000"
  worker:
    build: .
    env_file: .env
    volumes: [app_storage:/var/www/html/storage/app, ./.env:/var/www/html/.env]
    depends_on: [app, redis]
    command: php artisan queue:work redis --queue=default,documents,agents --tries=3 --timeout=120
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: business_engine
      POSTGRES_USER: business_engine
      POSTGRES_PASSWORD: change-me
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U business_engine -d business_engine"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes: [redis_data:/data]
  minio:
    image: minio/minio:latest
    profiles: ["object-storage"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-local-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-local-minio-secret}
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio_data:/data]
  model-node:
    image: ollama/ollama:latest
    profiles: ["model-node"]
    ports: ["11434:11434"]
    volumes: [ollama_data:/root/.ollama]
    restart: unless-stopped
volumes:
  postgres_data:
  redis_data:
  app_storage:
  minio_data:
  ollama_data: