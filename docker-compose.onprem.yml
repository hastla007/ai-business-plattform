services:
  app:
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
  worker:
    depends_on:
      app: { condition: service_healthy }
      redis: { condition: service_healthy }
  scheduler:
    depends_on:
      app: { condition: service_healthy }
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${DB_DATABASE:-business_engine}
      POSTGRES_USER: ${DB_USERNAME:-business_engine}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes: [engine_pgdata:/var/lib/postgresql/data]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U ${DB_USERNAME:-business_engine} -d ${DB_DATABASE:-business_engine}"]
      interval: 5s
      timeout: 5s
      retries: 12
  redis:
    image: redis:7-alpine
    command: ["redis-server","--appendonly","yes","--requirepass","${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}"]
    volumes: [engine_redis:/data]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL","redis-cli -a ${REDIS_PASSWORD} ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 12
volumes:
  engine_pgdata:
  engine_redis:
