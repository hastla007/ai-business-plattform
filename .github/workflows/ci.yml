name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: engine_test
          POSTGRES_USER: engine
          POSTGRES_PASSWORD: engine
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U engine -d engine_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, pdo_pgsql, zip
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - name: Export resolved lockfile for import
        run: echo "LOCK_B64_START"; base64 -w0 composer.lock; echo; echo "LOCK_B64_END"
      - uses: actions/upload-artifact@v4
        with:
          name: composer-lock
          path: composer.lock
          retention-days: 1
      - run: node --check app.js
      - run: python -m py_compile node-agent/agent.py
      - run: find app routes database/migrations tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: docker build --file Dockerfile.prod --tag ai-business-engine:ci .
      - run: cp .env.example .env
      - run: docker compose -f docker-compose.prod.yml -f docker-compose.onprem.yml config --quiet
      - run: docker compose -f docker-compose.prod.yml -f docker-compose.saas.yml config --quiet
      - run: php artisan migrate:fresh --force
        env:
          APP_ENV: testing
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: engine_test
          DB_USERNAME: engine
          DB_PASSWORD: engine
          CACHE_STORE: array
          SESSION_DRIVER: array
      - run: php artisan migrate:rollback --step=1 --force
        env:
          APP_ENV: testing
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: engine_test
          DB_USERNAME: engine
          DB_PASSWORD: engine
          CACHE_STORE: array
          SESSION_DRIVER: array
      - run: php artisan migrate --force
        env:
          APP_ENV: testing
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: engine_test
          DB_USERNAME: engine
          DB_PASSWORD: engine
          CACHE_STORE: array
          SESSION_DRIVER: array
      - run: vendor/bin/phpunit
        env:
          APP_ENV: testing
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: engine_test
          DB_USERNAME: engine
          DB_PASSWORD: engine
          CACHE_STORE: array
          SESSION_DRIVER: array
