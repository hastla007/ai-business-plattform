name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: engine_test
          POSTGRES_USER: engine
          POSTGRES_PASSWORD: engine
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U engine -d engine_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, pdo_pgsql, zip
          coverage: none
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: composer install --no-interaction --prefer-dist
      - run: composer validate --no-check-publish
      - run: node --check app.js
      - run: python -m py_compile node-agent/agent.py
      - run: find app routes database/migrations tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: docker build --file Dockerfile.prod --tag ai-business-engine:ci .
      - run: cp .env.example .env
      - run: docker compose -f docker-compose.prod.yml -f docker-compose.onprem.yml config --quiet
      - run: docker compose -f docker-compose.prod.yml -f docker-compose.saas.yml config --quiet
      - run: php artisan migrate:fresh --force
        env:
          APP_ENV: testing
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: engine_test
          DB_USERNAME: engine
          DB_PASSWORD: engine
          CACHE_STORE: array
          SESSION_DRIVER: array
      - run: php artisan migrate:rollback --step=1 --force
        env:
          APP_ENV: testing
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: engine_test
          DB_USERNAME: engine
          DB_PASSWORD: engine
          CACHE_STORE: array
          SESSION_DRIVER: array
      - run: php artisan migrate --force
        env:
          APP_ENV: testing
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: engine_test
          DB_USERNAME: engine
          DB_PASSWORD: engine
          CACHE_STORE: array
          SESSION_DRIVER: array
      - run: vendor/bin/phpunit
        env:
          APP_ENV: testing
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: engine_test
          DB_USERNAME: engine
          DB_PASSWORD: engine
          CACHE_STORE: array
          SESSION_DRIVER: array
      - name: On-prem install and backup/restore smoke
        run: |
          ./ops/install-onprem.sh
          curl --fail --retry 30 --retry-connrefused --retry-all-errors --retry-delay 2 http://127.0.0.1:8080/api/health/ready
          before_checksum=$(docker compose -f docker-compose.prod.yml -f docker-compose.onprem.yml exec -T app php /var/www/html/ops/backup-restore-fixture.php seed)
          ./ops/backup.sh
          db_backup=$(find backups -name 'database-*.sql' -print -quit)
          files_backup=$(find backups -name 'files-*.tar.gz' -print -quit)
          test -n "$db_backup" && test -n "$files_backup"
          ./ops/restore.sh "$db_backup" "$files_backup"
          curl --fail --retry 30 --retry-connrefused --retry-all-errors --retry-delay 2 http://127.0.0.1:8080/api/health/ready
          after_checksum=$(docker compose -f docker-compose.prod.yml -f docker-compose.onprem.yml exec -T app php /var/www/html/ops/backup-restore-fixture.php verify)
          test "$before_checksum" = "$after_checksum"
          docker compose -f docker-compose.prod.yml -f docker-compose.onprem.yml down -v
