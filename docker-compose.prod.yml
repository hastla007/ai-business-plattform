services:
  app:
    image: ${APP_IMAGE:-ai-business-engine:latest}
    build:
      context: .
      dockerfile: Dockerfile.prod
    env_file: .env
    expose: ["9000"]
    volumes: [engine_storage:/var/www/html/storage/app]
    restart: unless-stopped
    healthcheck:
      test: ["CMD","php","artisan","about"]
      interval: 30s
      timeout: 10s
      retries: 3
  worker:
    image: ${APP_IMAGE:-ai-business-engine:latest}
    build:
      context: .
      dockerfile: Dockerfile.prod
    env_file: .env
    command: ["php","artisan","queue:work","redis","--queue=default,documents,agents","--tries=3","--timeout=120"]
    volumes: [engine_storage:/var/www/html/storage/app]
    restart: unless-stopped
    depends_on:
      app: { condition: service_healthy }
  scheduler:
    image: ${APP_IMAGE:-ai-business-engine:latest}
    build:
      context: .
      dockerfile: Dockerfile.prod
    env_file: .env
    command: ["php","artisan","schedule:work"]
    volumes: [engine_storage:/var/www/html/storage/app]
    restart: unless-stopped
    depends_on:
      app: { condition: service_healthy }
  blackbox-exporter:
    image: ${BLACKBOX_EXPORTER_IMAGE:-prom/blackbox-exporter:latest}
    profiles: ["monitoring"]
    command: ["--config.file=/etc/blackbox_exporter/config.yml"]
    volumes: ["./ops/monitoring/blackbox.yml:/etc/blackbox_exporter/config.yml:ro"]
    restart: unless-stopped
  prometheus:
    image: ${PROMETHEUS_IMAGE:-prom/prometheus:latest}
    profiles: ["monitoring"]
    command: ["--config.file=/etc/prometheus/prometheus.yml","--storage.tsdb.path=/prometheus"]
    ports: ["127.0.0.1:9090:9090"]
    volumes:
      - "./ops/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro"
      - "./ops/monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro"
      - prometheus_data:/prometheus
    depends_on: [blackbox-exporter]
    restart: unless-stopped
  nginx:
    build:
      context: .
      dockerfile: Dockerfile.nginx
    ports: ["8080:8080"]
    restart: unless-stopped
    depends_on:
      app: { condition: service_healthy }
volumes:
  engine_storage:
  prometheus_data:
